model:
  dims: [128, 192, 256, 384]
  depths: [2, 2, 3, 3]
  spatial: [conv, conv, beamformer, beamformer]
  n_heads: 8

  stem: patch
  n_bands: 32
  kernel_size: 65
  patch_hidden: 32
  patch_kernel: 9
  fs: 200
  pool: 20
  window: 6000

  z_dim: null
  drop_path: 0.15
  dropout: 0.0
  n_dist_bins: 16
  n_global_queries: 4
  grad_checkpointing: true

  hop_div: 4
  f_max: 45.0