checkpoints_path: /home/infres/yrothlin-24/EEG_Foundation_Model/outputs/pretraining/without_augmentation/pretraining_best.pt
dataset: THINGSEEG

training:
  out_dir: /home/infres/yrothlin-24/EEG_Foundation_Model/outputs/contrastive/tests
  freeze_backbone: false
  freeze_channel_adaptor: false
  num_epochs: 50
  optimizer: "adamw"
  scheduler: "onecycle"  # cosine, step, plateau, onecycle, none
  lr: 0.00004
  max_lr: 0.0004
  onecycle_pct_start: 0.2
  onecycle_div_factor: 25.0
  onecycle_final_div_factor: 10000.0
  weight_decay: 0.01
  betas: [0.9, 0.999]
  grad_clip: 1.0
  use_amp: false
  log_step: 50
  max_step_train: 300
  max_step_val: 100
  max_step_test: null

  loss: supcon
  early_stopping_patience: 10
  restore_best_checkpoint: true
  monitoring_metric: top1


losses:
  infonce:
    temperature: 0.07
  supcon:
    temperature: 0.07


supcon_datasets:
  - PHYSIONETMI
  - BCI2A


clip:
  model_name: ViT-L-14
  pretrained: laion2b_s32b_b82k
  normalize: true


head:
  clip_dim: 768
  hidden_dim: 512
