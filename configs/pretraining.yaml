training:
  out_dir: outputs/pretraining
  num_epochs: 20
  resume_from: null

  lr: 1.5e-4
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_frac: 0.05
  grad_clip: 1.0
  use_amp: true

  channel_dropout: 0.2
  max_channel_drop: 3
  detach_target_until: null
  ema_momentum_start: 0.996
  ema_momentum_end: 1.0

  adaptive_weights: true
  max_weight_ratio: 4.0
  jepa_warmup_frac: 0.05
  sigreg_token_weight: 0.1

  loss_weights:
    jepa: 1.0
    spectral: 0.5
    physio: 0.5
    sigreg: 1.0

  masking:
    probs: [0.40, 0.25, 0.20, 0.15]
    ratio_start: 0.40
    ratio_end: 0.75
    ramp_frac: 0.20

  log_step: 50
  plot_every: 1
  diag_every: 1
  max_train_step: 2000
  max_val_step: 200